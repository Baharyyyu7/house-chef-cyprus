name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# Push'ta iptal yok: ajanlar sik commit attiginda her kosu bir sonrakince
# iptal ediliyordu ve 11 Agustos'tan sonra tek bir kosu bile bitmedi.
# Yalniz PR'da eski kosu gereksiz; orada iptal edilir.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: database/ci.sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@v2
        # Uretim PHP 8.4 (/opt/alt/php84); CI ayni surumu kosmali.
        with: {php-version: '8.4', extensions: sqlite3, coverage: none}
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: touch database/ci.sqlite
      - run: php artisan migrate:fresh --seed
      - run: npm run build
      # artisan test sarmalayicisi bazi ortamlarda SIGTERM aliyor; dogrudan phpunit.
      - run: php -d memory_limit=512M vendor/bin/phpunit
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --memory-limit=1G
      - run: php artisan api:openapi-check
      - run: php artisan api:openapi-check --json
      - run: php artisan app:environment-check --json
      - run: php artisan config:cache && php artisan route:cache && php artisan view:cache
      - run: ./scripts/secret-scan.sh && ./scripts/forbidden-file-scan.sh && ./scripts/docs-link-check.sh
      - run: bash -n setup.sh start.sh stop.sh restart.sh status.sh test.sh scripts/*.sh
      - run: composer audit
      - run: npm audit --omit=dev --audit-level=high
