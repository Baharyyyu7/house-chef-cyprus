# Replace __DOMAIN__ and the PHP-FPM socket for the target VPS before enabling.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    root __APP_ROOT__/public;
    index index.php;
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ { allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;
    root __APP_ROOT__/public;
    index index.php;
    client_max_body_size 10m;
    client_body_timeout 30s;
    send_timeout 30s;

    # Certificate directives are installed by Certbot or the chosen origin certificate process.
    # ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\. { deny all; }
    location ~* /(\.env|composer\.(json|lock)|package\.json)$ { deny all; }
    location = /health { try_files $uri /index.php?$query_string; access_log off; }
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }
}
