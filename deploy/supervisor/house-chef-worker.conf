; Replace __APP_ROOT__ and __APP_USER__ before installing in /etc/supervisor/conf.d/.
[program:house-chef-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_ROOT__/artisan queue:work redis --queue=default,reports,mail --sleep=3 --tries=3 --backoff=10 --timeout=120
directory=__APP_ROOT__
user=__APP_USER__
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=__APP_ROOT__/storage/logs/queue-default.log

[program:house-chef-worker-media]
command=php __APP_ROOT__/artisan queue:work redis --queue=media,seo-analysis,content-generation,backups --sleep=3 --tries=2 --backoff=30 --timeout=300
directory=__APP_ROOT__
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=__APP_ROOT__/storage/logs/queue-media.log
